---
# File: vars/Debian.yml - Debian OS variables for Nomad

nomad_os_packages:
  - curl
  - git
  - >-
    {% if
        (ansible_distribution == 'Ubuntu'
         and ansible_distribution_version is version('22.10', '<'))
        or
        (ansible_distribution == 'Debian'
         and ansible_distribution_version is version('12', '<'))
    %}
      libcgroup1
    {% elif
        (ansible_distribution == 'Ubuntu'
         and ansible_distribution_version is version('22.10', '>=')
         and ansible_distribution_version is version('25.10', '<'))
        or
        (ansible_distribution == 'Debian'
         and ansible_distribution_version is version('12', '>=')
         and ansible_distribution_version is version('13', '<'))
    %}
      libcgroup2
    {% else %}
      libcgroup3
    {% endif %}
  - unzip
  - "{% if (ansible_distribution == 'Ubuntu' and ansible_distribution_version is version('19', '<')) or (ansible_distribution == 'Debian' and ansible_distribution_version
    is version('11', '<')) %}cgroup-bin{% else %}cgroup-tools{% endif %}"
